<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kai workspace</title>
<style>
:root{color-scheme:light dark;font:13px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--color-text-primary,#e9e9ef);background:var(--color-background-primary,#19191f)}*{box-sizing:border-box}body{margin:0;padding:18px}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}header b{font-size:16px;letter-spacing:-.4px}small{color:var(--color-text-secondary,#9696a3);font-size:11px}.space{flex:1}button{font:inherit;cursor:pointer;border:1px solid #8f8fa32b;background:#8f8fa312;border-radius:9px;padding:6px 10px;color:inherit;transition:background .16s,transform .16s}button:hover{background:#8984ff28}button:active{transform:scale(.97)}button:disabled{cursor:default;opacity:.45}h2{font-size:11px;font-weight:500;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.09em;color:var(--color-text-secondary,#9696a3)}.row{display:flex;align-items:center;gap:9px;border-bottom:1px solid #8f8fa31c;padding:10px 0;animation:arrive .22s both}.name{min-width:0;flex:1}.name b{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.name small{display:block;margin-top:3px}.mark{width:7px;height:7px;border-radius:50%;background:linear-gradient(140deg,#bd9bff,#548cff)}.approval{padding:12px;border:1px solid #efa56435;border-radius:12px;margin-top:8px;background:linear-gradient(130deg,#e3a75b12,transparent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto;font:11px ui-monospace,monospace;color:inherit}.actions{display:flex;gap:6px;flex-wrap:wrap}.quiet{padding:10px 0;color:var(--color-text-secondary,#9696a3)}#message{white-space:pre-wrap;font-size:11px;margin-top:12px;color:var(--color-text-secondary,#9696a3)}#content{max-height:480px;overflow:auto}a{color:inherit}@keyframes arrive{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header><span class="mark"></span><b>Kai</b><small id="connection"></small><span class="space"></span><button id="refresh">Refresh</button></header><main id="content"></main><div id="message" role="status"></div>
<script>
(()=>{'use strict';let next=1,ready=false,busy=false;const pending=new Map(),mutations=new Map();const $=id=>document.getElementById(id);const note=text=>{$('message').textContent=text||''};
function notify(method,params={}){window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){if(pending.size>=16)return Promise.reject(Error('Too many pending requests'));const id=next++;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(Error('The host did not acknowledge this request.'))},35000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function result(value){if(value.structuredContent)return value.structuredContent;const item=value.content?.find(c=>c.type==='text');if(!item)throw Error('The host returned no workspace data');return JSON.parse(item.text)}
async function command(args){const raw=await request('tools/call',{name:'kai_workspace',arguments:args});const value=result(raw);if(raw.isError||value.error)throw Error(value.error||value.result?.error||value.state||'Command was rejected');return value}
async function mutate(key,args,button){if(busy)return;const previous=mutations.get(key);const requestArgs=previous||{...args,request_id:crypto.randomUUID()};mutations.set(key,requestArgs);busy=true;button.disabled=true;try{const response=await command(requestArgs);if(response.state==='uncertain')throw Error('Acknowledgement uncertain. Refresh actual task state before retrying. Receipt: '+requestArgs.request_id);mutations.delete(key);note('');await refresh()}catch(error){note(error.message+'\nReceipt: '+requestArgs.request_id)}finally{busy=false;button.disabled=false}}
function element(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=String(text);if(cls)node.className=cls;return node}
function button(label,action){const node=element('button',label);node.onclick=()=>action(node);return node}
function render(state){$('connection').textContent=state.connected?(state.access==='control'?'Connected':'Read only'):'Host disconnected';const content=$('content');content.replaceChildren();const control=state.access==='control';
const approvals=state.approvals||[];if(approvals.length){content.append(element('h2','Needs your attention'));for(const item of approvals){const approval=item.approval,request=approval?.request;if(!request)continue;const card=element('section',undefined,'approval');card.append(element('b',request.title||'Approval'),element('pre',request.detail||''));const choices=request.request_kind?.Approval?.choices||[];const actions=element('div',undefined,'actions');for(const choice of choices){const b=button(choice.label,node=>mutate('answer:'+approval.approvalRequestId+':'+choice.id,{action:'answer',chat_id:item.owner,answer:{approvalRequestId:approval.approvalRequestId,choice:choice.id}},node));b.disabled=!control;actions.append(b)}card.append(actions);content.append(card)}}
content.append(element('h2','Tasks'));const tasks=state.tasks||[];if(!tasks.length)content.append(element('div','No active or recent tasks','quiet'));for(const task of tasks.slice(0,30)){const row=element('div',undefined,'row'),name=element('div',undefined,'name');name.append(element('b',task.title||task.chat_id),element('small',[task.agent,task.status,task.model||task.usage?.model,task.effort||task.usage?.reasoning_effort].filter(Boolean).join(' · ')));row.append(element('span',undefined,'mark'),name);if(control){row.append(button('Open',node=>mutate('open:'+task.chat_id,{action:'open_chat',chat_id:task.chat_id},node)));if(!task.terminal&&task.run_id)row.append(button('Stop',node=>mutate('stop:'+task.run_id,{action:'stop',chat_id:task.chat_id,run_id:task.run_id},node)))}content.append(row)}
if(state.children?.length){content.append(element('h2','Sub-agents'));for(const child of state.children){const row=element('div',undefined,'row');row.append(element('span',undefined,'mark'));const name=element('div',undefined,'name');name.append(element('b',child.name||child.id),element('small',[child.agent,child.status,child.model,child.effort].filter(Boolean).join(' · ')));row.append(name);content.append(row)}}
notify('ui/notifications/size-changed',{height:Math.min(600,document.body.scrollHeight),width:document.body.scrollWidth})}
async function refresh(){if(!ready)return;$('refresh').disabled=true;try{render(await command({action:'snapshot'}));note('')}catch(error){note(error.message)}finally{$('refresh').disabled=false}}
window.addEventListener('message',event=>{if(event.source!==window.parent||!event.data||event.data.jsonrpc!=='2.0')return;const value=event.data;if(!value.method&&value.id!==undefined&&pending.has(value.id)){const item=pending.get(value.id);pending.delete(value.id);clearTimeout(item.timer);if(value.error)item.reject(Error(value.error.message||'Host request failed'));else item.resolve(value.result);return}if(value.method==='ui/notifications/tool-result'){try{const data=result(value.params);if(data.protocol&&data.connected!==undefined)render(data)}catch{}}else if(value.method==='ui/resource-teardown'&&value.id!==undefined){ready=false;for(const item of pending.values()){clearTimeout(item.timer);item.reject(Error('Workspace view closed'))}pending.clear();window.parent.postMessage({jsonrpc:'2.0',id:value.id,result:{}},'*')}});
$('refresh').onclick=refresh;
request('ui/initialize',{appInfo:{name:'Kai workspace',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(value=>{ready=true;const theme=value.hostContext?.theme;if(theme==='light'||theme==='dark')document.documentElement.style.colorScheme=theme;notify('ui/notifications/initialized');refresh()}).catch(error=>note(error.message));
})();
</script></html>
